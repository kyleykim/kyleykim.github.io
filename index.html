<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyle Kim</title>
  <meta name="description" content="Kyle Kim is a data visualization specialist based in New York City, making graphics for Bloomberg News.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F3EC;
      --ink: #141413;
      --body: #3D3D3A;
      --muted: #73726C;
      --rule: #DDD7CA;
      --accent: #C2643F;
      --serif: "Lora", Georgia, "Times New Roman", serif;
      --sans: "Lato", "Helvetica Neue", Arial, sans-serif;
      --max: 1120px;
      --gutter: clamp(16px, 4vw, 48px);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--body);
      font: 400 17px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--accent); }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .site-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
      padding: 40px 0 0;
    }
    .name { font: 400 22px/1 var(--serif); color: var(--ink); margin: 0; }
    nav { display: flex; gap: 22px; font-size: 15px; white-space: nowrap; }
    nav a { text-decoration: none; color: var(--body); }
    nav a:hover { color: var(--accent); }

    main { flex: 1; display: flex; align-items: center; }
    .hero {
      font: 400 clamp(32px, 5.6vw, 64px)/1.18 var(--serif);
      color: var(--ink);
      letter-spacing: -0.015em;
      max-width: 17em;
      margin: 0;
      padding: 80px 0;
    }
    .hero a { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 6px; }
    .hero a:hover { color: var(--accent); }

    .site-foot {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px 24px;
      padding: 0 0 40px; color: var(--muted); font-size: 15px;
    }
    .bg-cycle { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .bg-cycle .bg-name { color: var(--body); }
    .bg-cycle:hover, .bg-cycle:hover .bg-name { color: var(--accent); }
    .bg-cycle .ico { display: inline-block; margin-left: 2px; transition: transform .4s ease; }
    .bg-cycle:hover .ico { transform: rotate(180deg); }

    /* temporary background picker (only shown in preview) */
    .bg-picker {
      position: fixed; right: 16px; bottom: 88px; z-index: 2;
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px;
      max-width: min(460px, calc(100vw - 32px)); padding: 10px;
      background: rgba(245, 243, 236, .9); border: 1px solid var(--rule); border-radius: 8px;
      font: 12px/1 var(--sans);
    }
    .bg-picker span {
      width: 100%; text-align: right; margin-bottom: 2px;
      font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }
    .bg-picker button {
      font: inherit; padding: 6px 10px; cursor: pointer;
      color: var(--body); background: transparent; border: 1px solid var(--rule); border-radius: 999px;
    }
    .bg-picker button:hover { color: var(--accent); border-color: var(--accent); }
    .bg-picker button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

    @media (max-width: 560px) {
      .site-head { flex-direction: column; gap: 14px; }
      nav { gap: 16px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="wrap">
    <header class="site-head">
      <p class="name">Kyle Kim</p>
      <nav aria-label="Site">
        <a href="/maps">Map work</a>
        <a href="/resume">Resume</a>
        <a href="mailto:yong.kyle.kim@gmail.com">Email</a>
      </nav>
    </header>
  </div>

  <main class="wrap">
    <h1 class="hero">Data visualization specialist based in New York City. Currently making graphics for <a href="https://www.bloomberg.com/authors/AV6neccr7To/kyle-kim">Bloomberg News</a>.</h1>
  </main>

  <div class="wrap">
    <footer class="site-foot">
      <a href="https://www.linkedin.com/in/kyleykim">LinkedIn</a>
      <button class="bg-cycle" type="button" title="Show another background" hidden>Background: <span class="bg-name"></span> <span class="ico" aria-hidden="true">↻</span></button>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="script/background.js"></script>
</body>
</html>
